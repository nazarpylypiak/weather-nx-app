<div class="flex justify-between items-center gap-[16px] mb-3 pr-[18px]">
  <h3 clas="flex-1">Hourly forecast</h3>

  <app-dropdown
    (selectedChange)="onChange($event)"
    [list]="weekDayNames"
    [selected]="selectedWeekDay()"
    #dropdown
    buttonClasses="bg-neutral-700"
  />
</div>

<div class="h-screen overflow-y-auto scrollbar-custom gap-4 pr-2">
  @if (loading()) {
    @for (fakeDay of [].constructor(24); track $index) {
      <div
        class="flex justify-between h-12 bg-neutral-700 gap-2 p-3 rounded-md border border-neutral-600 mb-3"
      ></div>
    }
  } @else {
    @for (dayHour of weekDays.get(selectedWeekDay()); track dayHour.time) {
      <div
        [ngClass]="{ 'mb-3': !$last }"
        class="flex items-center justify-between px-3 bg-neutral-700 gap-2 h-12 rounded-md border border-neutral-600"
      >
        <div class="flex items-center">
          <img
            [src]="dayHour.wCode | weatherCode"
            class="w-8 mr-2"
            alt="Weather icon"
          />
          <div>{{ dayHour.time | date: 'hh aa' }}</div>
        </div>
        <div>{{ dayHour.temp }}°</div>
      </div>
    }
  }
</div>
