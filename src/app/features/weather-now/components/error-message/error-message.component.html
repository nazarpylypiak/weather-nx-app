<div class="flex justify-center text-white flex-col items-center">
  <mat-icon
    svgIcon="error"
    class="!w-6 !h-6 mb-3"
    aria-hidden="true"
  ></mat-icon>
  <h3 class="text-4xl font-medium mb-3">Something went wrong</h3>
  <p class="text-base mb-3">
    We couldn't connect to the server (API error). Please try again in a few
    moments.
  </p>
  <button
    type="button"
    (click)="retry.emit()"
    matFab
    extended
    class="!bg-slate-700 hover:!bg-slate-600 !rounded-lg !normal-case"
  >
    <mat-icon svgIcon="reload" class="!w-4 !h-4" aria-hidden="true"></mat-icon>
    Retry
  </button>
</div>
